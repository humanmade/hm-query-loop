name: PR Playground Preview

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    build-and-preview:
        runs-on: ubuntu-latest
        # Only run for same-repo pull requests. Fork PRs receive a read-only
        # GITHUB_TOKEN, so the push to the pr-<n>-built branch (which needs
        # contents: write) would hard-fail rather than be gracefully skipped.
        if: github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm i

            - name: Replace version with PR info
              # PR_NUMBER is passed as an environment variable so it reaches the
              # shell as data, never as source text. The PR title is deliberately
              # NOT used: it is attacker-controlled and interpolating it into this
              # script (directly, or via sed's replacement metacharacters) would
              # allow command injection on the runner.
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  # Stamp a fixed, safe version string derived only from the PR number.
                  sed -i "s/__VERSION__/0.0.0-pr${PR_NUMBER}/g" hm-query-loop.php

                  echo "Updated plugin version to: 0.0.0-pr${PR_NUMBER}"
                  grep "Version:" hm-query-loop.php

            - name: Build plugin
              run: npm run build

            - name: Push built files to PR branch
              # These values are safe (numeric id / commit SHA), but they are still
              # passed via env so that no ${{ }} expression is interpolated into a
              # shell script anywhere in this workflow.
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  # Configure git
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  # Create and checkout a new branch for this PR's built files
                  BRANCH_NAME="pr-${PR_NUMBER}-built"

                  # Create/recreate the branch from current state
                  git checkout -B "$BRANCH_NAME"

                  # Add all files including built assets and any lock file changes
                  git add -f build/
                  git add -A

                  # Commit if there are changes
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "Build assets for PR #${PR_NUMBER} (commit: ${HEAD_SHA})"
                    git push origin "$BRANCH_NAME" --force
                  fi

            - name: Generate Playground blueprint and post preview button
              uses: WordPress/action-wp-playground-pr-preview@v2
              with:
                  mode: 'append-to-description'
                  blueprint: |
                      {
                        "landingPage": "/wp-admin/",
                        "preferredVersions": {
                          "php": "8.3",
                          "wp": "6.8"
                        },
                        "steps": [
                          {
                            "step": "login",
                            "username": "admin",
                            "password": "password"
                          },
                          {
                            "step": "installTheme",
                            "themeData": {
                              "resource": "wordpress.org/themes",
                              "slug": "twentytwentyfive"
                            },
                            "options": {
                              "activate": true
                            }
                          },
                          {
                            "step": "installPlugin",
                            "pluginZipFile": {
                              "resource": "url",
                              "url": "https://github.com/${{ github.repository }}/archive/refs/heads/pr-${{ github.event.pull_request.number }}-built.zip"
                            }
                          }
                        ]
                      }
                  github-token: ${{ secrets.GITHUB_TOKEN }}
