name: E2E (latest upstream)

# Early warning for upstream drift.
#
# .wp-env.json pins WordPress core and Advanced Query Loop to exact versions so
# that PR CI is reproducible and re-running an old green commit stays green.
# The trade-off is that a breaking upstream release is invisible until someone
# bumps a pin. This workflow runs the same suite against the latest releases on
# a schedule, so we find out on our own time instead of mid-PR.
#
# It never runs on pull requests, so a failure here cannot block a merge.

on:
    schedule:
        # 05:00 UTC every Monday.
        - cron: '0 5 * * 1'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    e2e:
        name: Playwright
        permissions:
            contents: read
            pull-requests: write
        uses: ./.github/workflows/playwright-tests.yml
        with:
            unpinned: true

    report:
        name: Report drift
        needs: e2e
        if: failure() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - name: Open or update the drift issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail

                  title='E2E suite fails against latest WordPress / Advanced Query Loop'
                  body=$(printf '%s\n' \
                    'The scheduled `E2E (latest upstream)` run failed.' \
                    '' \
                    'The suite passes against the versions pinned in `.wp-env.json` but fails' \
                    'against the latest WordPress core and Advanced Query Loop releases, so' \
                    'bumping those pins will break PR CI until the suite is updated.' \
                    '' \
                    "Failing run: ${RUN_URL}")

                  # One rolling issue rather than one per week.
                  existing=$(gh issue list --state open --search "$title in:title" \
                    --json number --jq '.[0].number // empty')

                  if [ -n "$existing" ]; then
                    gh issue comment "$existing" --body "$body"
                  else
                    gh issue create --title "$title" --body "$body"
                  fi
